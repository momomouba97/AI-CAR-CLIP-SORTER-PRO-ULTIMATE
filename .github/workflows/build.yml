
name: Build AI CAR CLIP SORTER PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0

      - name: Build application
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "AI CAR CLIP SORTER PRO" \
            --collect-all PySide6 \
            --collect-all scenedetect \
            --collect-all cv2 \
            main.py

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R "dist/AI CAR CLIP SORTER PRO.app" dmg/
          hdiutil create \
            -volname "AI CAR CLIP SORTER PRO" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            "AI_CAR_CLIP_SORTER_PRO.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AI-CAR-CLIP-SORTER-PRO-macOS
          path: AI_CAR_CLIP_SORTER_PRO.dmg
